global:
  scrape_interval: 15s
  evaluation_interval: 15s

alerting:
  alertmanagers: []

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: 'nestorria-server'
    metrics_path: '/actuator/prometheus'
    static_configs:
      - targets: ['server:4000']
        labels: { application: 'nestorria-server' }
  - job_name: 'nestorria-ai-service'
    metrics_path: '/metrics'
    static_configs:
      - targets: ['ai-service:8000']
        labels: { application: 'nestorria-ai-service' }