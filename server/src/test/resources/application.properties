# Test configuration
spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false

# Disable Clerk validation for tests
clerk.issuer-uri=https://test.issuer
clerk.jwk-set-uri=https://test.issuer/.well-known/jwks.json

# Disable mail for tests
spring.mail.host=localhost
spring.mail.port=25

# Disable Cloudinary for tests
cloudinary.cloud-name=test
cloudinary.api-key=test
cloudinary.api-secret=test

# App config
app.mail.sender=test@nestorria.com
app.currency=$
app.cors.allowed-origins=http://localhost:5173

# Async configuration
spring.task.shutdown.await-quiet-period=0s
spring.task.shutdown.await-termination=0s
