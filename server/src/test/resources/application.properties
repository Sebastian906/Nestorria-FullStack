# Test configuration
spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false

# Disable Clerk validation for tests
clerk.issuer-uri=https://test.issuer
clerk.jwk-set-uri=https://test.issuer/.well-known/jwks.json

# Disable mail for tests
spring.mail.host=localhost
spring.mail.port=25

# Disable Cloudinary for tests
cloudinary.cloud-name=test
cloudinary.api-key=test
cloudinary.api-secret=test

# App config
app.mail.sender=test@nestorria.com
app.currency=$
app.cors.allowed-origins=http://localhost:5173

# Async configuration
spring.task.shutdown.await-quiet-period=0s
spring.task.shutdown.await-termination=0s

# Stripe (test)
stripe.api-key=sk_test_fake_key_for_testing
stripe.webhook-secret=whsec_test_fake_secret_for_testing

# Invoice
app.invoice.tax-rate=0.18
app.invoice.due-days=15
app.invoice.late-fee-percentage=0.10

# App Stripe config (for AppProperties binding)
app.stripe.allowed-origins=http://localhost:5173

# Rate Limiting (for AppProperties binding)
app.rate-limit.enabled=true
app.rate-limit.read-per-minute=100
app.rate-limit.write-per-minute=10
app.rate-limit.review-per-minute=5
app.rate-limit.stripe-per-minute=10
app.rate-limit.public-read-per-minute=60
app.rate-limit.search-per-minute=30
app.rate-limit.trusted-proxies=

# Cache (for integration tests)
spring.cache.type=caffeine
spring.cache.caffeine.spec=maximumSize=100,expireAfterWrite=1m,recordStats

# Scheduler (for tests)
spring.task.scheduling.pool.size=2
spring.task.scheduling.thread-name-prefix=sched-