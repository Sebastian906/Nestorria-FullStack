server.port=4000

# Primary
spring.datasource.url=${DB_URI:${DB_URL}}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

# Replica
app.db.replica-url=${DB_REPLICA_URL:}
app.db.replica-username=${DB_REPLICA_USERNAME:${DB_USERNAME}}
app.db.replica-password=${DB_REPLICA_PASSWORD:${DB_PASSWORD}}

spring.jpa.hibernate.ddl-auto=update

spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.stat=OFF

# HikariCP Connection Pool
# Formula: pool_size × instances < PostgreSQL max_connections (typically 100).
# Adjust based on actual load testing.
spring.datasource.hikari.maximum-pool-size=20
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.max-lifetime=1200000
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.leak-detection-threshold=60000
spring.datasource.hikari.pool-name=NestorriaPool

# Slow Query Logging
# Log queries slower than 1 second. Remove or raise threshold in production
# if volume is high.
spring.jpa.properties.hibernate.session.events.log.LOG_QUERIES_SLOWER_THAN_MS=1000
logging.level.org.hibernate.SQL=WARN
logging.level.org.hibernate.stat=DEBUG
logging.level.com.zaxxer.hikari=WARN

clerk.issuer-uri=${CLERK_ISSUER_URI:https://top-opossum-75.clerk.accounts.dev}
clerk.jwk-set-uri=${CLERK_JWKS_URL:${clerk.issuer-uri}/.well-known/jwks.json}

cloudinary.cloud-name=${CLDN_NAME}
cloudinary.api-key=${CLDN_API_KEY}
cloudinary.api-secret=${CLDN_API_SECRET}

# CORS - orígenes permitidos (separados por coma)
app.cors.allowed-origins=${CORS_ORIGINS:http://localhost:5173,http://localhost:5174}

# Límite de tamaño para multipart (ajusta según necesites)
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=40MB

# Mail (Brevo SMTP)
spring.mail.host=smtp-relay.sendinblue.com
spring.mail.port=587
spring.mail.username=${SMTP_USER}
spring.mail.password=${SMTP_PASS}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# Remitente y moneda (equivalente a SENDER_EMAIL y CURRENCY del tutorial)
app.mail.sender=${SENDER_EMAIL}
app.currency=${CURRENCY:$}

# Contract configuration
app.contract.signature-expiry-days=30

# Stripe Configuration
stripe.api-key=${STRIPE_API_KEY}
stripe.webhook-secret=${STRIPE_WEBHOOK_SECRET}
app.stripe.allowed-origins=${STRIPE_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:5174}

# Invoice Configuration
app.invoice.tax-rate=0.18
app.invoice.due-days=15
app.invoice.late-fee-percentage=0.10

# Rate Limiting Configuration
app.rate-limit.enabled=true
app.rate-limit.read-per-minute=100
app.rate-limit.write-per-minute=10
app.rate-limit.review-per-minute=5
app.rate-limit.stripe-per-minute=10
app.rate-limit.public-read-per-minute=60
app.rate-limit.search-per-minute=30
app.rate-limit.trusted-proxies=

# Cache — local in-memory only, valid for single-instance deployment.
# If scaling to multiple instances, switch to Redis or add cross-instance
# eviction (e.g. Spring Cache + Redis, or a cache event bus).
spring.cache.type=caffeine
spring.cache.caffeine.spec=maximumSize=1000,expireAfterWrite=5m,recordStats

# Actuator — Observabilidad
management.metrics.tags.application=${spring.application.name:Nestorria}
management.endpoints.web.exposure.include=health,metrics,info
management.endpoint.health.show-details=when-authorized
management.simple.metrics.export.enabled=true

# Scheduler — configura el ThreadPoolTaskScheduler que usa @Scheduled
spring.task.scheduling.pool.size=2
spring.task.scheduling.thread-name-prefix=sched-
spring.task.scheduling.shutdown.await-termination=true
spring.task.scheduling.shutdown.await-termination-period=30s

# Identidad de instancia — para distinguir instancias en logs/health checks.
# Precedencia: APP_INSTANCE_ID (explicito) > HOSTNAME (Docker/K8s) > UUID aleatorio (local).
app.instance-id=${APP_INSTANCE_ID:${HOSTNAME:${random.uuid}}}

server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=30s

logging.pattern.level=%5p [%X{instanceId}]