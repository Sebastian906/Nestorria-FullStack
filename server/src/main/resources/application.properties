server.port=4000

spring.datasource.url=${DB_URI:${DB_URL}}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=update

spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

clerk.issuer-uri=https://top-opossum-75.clerk.accounts.dev
clerk.jwk-set-uri=${clerk.issuer-uri}/.well-known/jwks.json

cloudinary.cloud-name=${CLDN_NAME}
cloudinary.api-key=${CLDN_API_KEY}
cloudinary.api-secret=${CLDN_API_SECRET}

# CORS - orígenes permitidos (separados por coma)
app.cors.allowed-origins=${CORS_ORIGINS:http://localhost:5173,http://localhost:5174}

# Límite de tamaño para multipart (ajusta según necesites)
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=40MB

# Mail (Brevo SMTP)
spring.mail.host=smtp-relay.sendinblue.com
spring.mail.port=587
spring.mail.username=${SMTP_USER}
spring.mail.password=${SMTP_PASS}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# Remitente y moneda (equivalente a SENDER_EMAIL y CURRENCY del tutorial)
app.mail.sender=${SENDER_EMAIL}
app.currency=${CURRENCY:$}

# Contract configuration
app.contract.signature-expiry-days=30

# Stripe Configuration
stripe.api-key=${STRIPE_API_KEY}
stripe.webhook-secret=${STRIPE_WEBHOOK_SECRET}
app.stripe.allowed-origins=${STRIPE_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:5174}

# Invoice Configuration
app.invoice.tax-rate=0.18
app.invoice.due-days=15
app.invoice.late-fee-percentage=0.10