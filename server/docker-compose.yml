# Development-only: provides a primary PostgreSQL instance.
# The postgres-replica service is an INDEPENDENT instance, NOT a streaming replica.
# It does NOT receive WAL updates from primary — data is not in sync.
# To enable read replica routing, configure streaming replication separately
# and set DB_REPLICA_URL in .env. Until then, leave DB_REPLICA_URL commented out.

version: '3.8'

services:
  postgres-primary:
    image: postgis/postgis:16-3.4
    container_name: nestorria-primary
    environment:
      POSTGRES_DB: nestorria
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - primary_data:/var/lib/postgresql/data

  ai-service:
    build:
      context: ../ai-service
      dockerfile: Dockerfile
    container_name: nestorria-ai-service
    ports:
      - "8000:8000"
    environment:
      - SERVICE_NAME=ai-service
      - ENVIRONMENT=development
      - LOG_LEVEL=INFO
    env_file:
      - ../ai-service/.env
    depends_on:
      postgres-primary:
        condition: service_started
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    restart: unless-stopped

  # Disabled by default. Uncomment and configure streaming replication before use.
  # postgres-replica:
  #   image: postgis/postgis:16-3.4
  #   container_name: nestorria-replica
  #   environment:
  #     POSTGRES_DB: nestorria
  #     POSTGRES_USER: postgres
  #     POSTGRES_PASSWORD: postgres
  #   ports:
  #     - "5433:5432"
  #   volumes:
  #     - replica_data:/var/lib/postgresql/data
  #   depends_on:
  #     - postgres-primary

volumes:
  primary_data:
  # replica_data: