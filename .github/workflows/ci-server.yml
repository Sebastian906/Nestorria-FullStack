name: CI Server

on:
  push:
    branches: [main]
    paths:
      - 'server/**'
      - '.github/workflows/ci-server.yml'
  pull_request:
    branches: [main]
    paths:
      - 'server/**'
      - '.github/workflows/ci-server.yml'

permissions:
  contents: read

jobs:
  build-and-test:
    name: Build & Test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      - name: Make mvnw executable
        run: chmod +x mvnw

      - name: Build
        run: ./mvnw compile -B

      - name: Test
        run: ./mvnw test -B

      - name: Package
        run: ./mvnw package -DskipTests -B

      - name: Verify JAR
        run: ls -lh target/*.jar

  docker-build:
    name: Docker Build
    runs-on: ubuntu-latest
    needs: build-and-test
    defaults:
      run:
        working-directory: server

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Make mvnw executable
        run: chmod +x mvnw

      - name: Build Docker image
        run: docker build -t nestorria-server-test .

      - name: Verify image
        run: docker images nestorria-server-test