# Backend services orchestration for local development.
# Frontends (frontend/, admin/) run outside Docker with pnpm dev.

services:
  # PostgreSQL (primary)
  postgres-primary:
    image: pgvector/pgvector:pg16
    container_name: nestorria-primary
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - primary_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d nestorria"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # Spring Boot (server)
  server:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: nestorria-server
    ports:
      - "4000:4000"
    env_file:
      - ./server/.env
    environment:
      DB_URI: jdbc:postgresql://postgres-primary:5432/nestorria
      DB_REPLICA_URL: ""  # Deshabilita replica en Docker (solo existe en desarrollo local)
      AI_SERVICE_URL: http://ai-service:8000
    depends_on:
      postgres-primary:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:4000/actuator/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s
    restart: unless-stopped

  # AI Service (FastAPI)
  ai-service:
    build:
      context: ./ai-service
      dockerfile: Dockerfile
    container_name: nestorria-ai-service
    ports:
      - "8000:8000"
    env_file:
      - ./ai-service/.env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres-primary:5432/nestorria_ai
      SPRING_BOOT_BASE_URL: http://server:4000
    depends_on:
      postgres-primary:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:v3.1.0
    container_name: nestorria-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./devops/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./devops/prometheus/alerts.yml:/etc/prometheus/alerts.yml:ro
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.retention.time=7d'
    depends_on:
      - server
      - ai-service
    restart: unless-stopped

  grafana:
    image: grafana/grafana:11.3.0
    container_name: nestorria-grafana
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=nestorria # SOLO local
    volumes:
      - grafana_data:/var/lib/grafana
      - ./devops/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./devops/grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      - prometheus
    restart: unless-stopped

volumes:
  primary_data:
  prometheus_data:
  grafana_data: