[project]
name = "ai-service"
version = "0.1.0"
description = "AI Service for Nestorria — ML/DL/RAG foundation"
requires-python = ">=3.12"
license = { text = "MIT" }
readme = "README.md"

dependencies = [
    "fastapi>=0.115.0,<1.0.0",
    "uvicorn[standard]>=0.30.0,<1.0.0",
    "pydantic-settings>=2.0.0,<3.0.0",
    "structlog>=24.0.0,<26.1.0",
    "scikit-learn>=1.5.0,<2.0.0",
    "pandas>=2.2.0,<3.0.5",
    "numpy>=2.0.0,<3.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0,<9.1.1",
    "pytest-asyncio>=0.24.0,<1.4.0",
    "httpx>=0.27.0,<1.0.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["app/tests"]